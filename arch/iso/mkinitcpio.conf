# nixarch ISO initramfs (mkinitcpio.conf.d drop-in, overrides the stock
# conf). No autodetect: image carries all block/fs drivers so the same
# ISO boots VMs and real hardware. systemd init, not busybox: the root
# overlay is a generated mount unit, and sd-encrypt only composes with
# this hook set. base stays for a rescue shell and blkid.
# sd-encrypt is unconditional and only ever unlocks the data partition
# (nixgen-crypt): it is inert without rd.luks.name= on the cmdline, and
# the ISO is also the rescue path for a box that has it. Unlocking here
# rather than in the booted system is what puts /run/nixdata's device
# in place before the data generator's 10s probe looks for it.
MODULES=(loop overlay squashfs iso9660 sr_mod cdrom)
BINARIES=()
FILES=()
HOOKS=(base systemd keyboard block sd-encrypt nixgen)
COMPRESSION="zstd"
